[build-system]
requires = ["setuptools>=61", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "actslim"
version = "0.1.0"
description = "Standalone reader for ACT slim-compressed dirfile TODs (no libactpol/zzip/getdata)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ACT" }]
keywords = ["ACT", "ACTPol", "slim", "dirfile", "TOD", "cosmology"]
dependencies = ["numpy>=1.17"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
hdf5 = ["h5py"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ACTCollaboration/actslim"

[tool.setuptools]
packages = ["actslim"]

[tool.setuptools.package-data]
# Ship the vendored slim sources so sdists can rebuild the extension.
actslim = ["_vendor_slim/*.cpp", "_vendor_slim/*.h"]
